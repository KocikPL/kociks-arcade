<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kocik's arcade - title</title>

<!--
  ============================================================
   kocik's arcade - TITLE BANNER (RETRO CRT / OLD COMPUTER STYLE)
   ------------------------------------------------------------
   OPTION A - embed this whole file:
     <iframe src="title.html" style="border:0; width:100%; height:220px;"></iframe>

   OPTION B - copy into your site:
     1. Copy the <div class="kac-title"> ... </div> block below
        into your page (index.html) where you want the title.
     2. Copy the CSS between the markers
          /* >>> kac-title CSS start <<<
        and
          /* <<< kac-title CSS end <<<
        into your style.css.
     3. Delete anything marked "preview only".

   Open this file in a browser to see it live.
  ============================================================
-->

<style>
  /* >>> kac-title CSS start <<< */
  .kac-title {
    --phosphor: #ffffff;       /* classic terminal green */
    --phosphor-dim: #8f8f8f;
    --scanline: rgba(255, 255, 255, 0.08);
    --bg: #0f0f0f;
    font-family: "VT323", "Courier New", ui-monospace, monospace;
    text-align: center;
    padding: 36px 16px 28px;
    background:
      /* CRT scanlines */
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        var(--scanline) 2px,
        var(--scanline) 4px
      ),
      /* vignette */
      radial-gradient(ellipse at center, transparent 60%, #000 120%),
      var(--bg);
    background-size: 100% 4px, 100% 100%, 100% 100%;
    position: relative;
    border: 2px solid #333333;
    border-radius: 8px;
    box-shadow:
      inset 0 0 60px rgba(255, 255, 255, 0.06),
      0 0 30px rgba(255, 255, 255, 0.15),
      inset 0 1px 0 rgba(255, 255, 255, 0.2);
    overflow: hidden;
  }
  .kac-title::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.04), transparent 70%);
    pointer-events: none;
  }
  .kac-title::after {
    content: "";
    position: absolute;
    inset: 0;
    /* subtle screen curvature */
    background: linear-gradient(180deg,
      rgba(0, 0, 0, 0.3) 0%,
      transparent 15%,
      transparent 85%,
      rgba(0, 0, 0, 0.3) 100%);
    pointer-events: none;
  }

  .kac-kicker {
    display: block;
    margin: 0 0 14px;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--phosphor-dim);
    text-shadow: 0 0 6px var(--phosphor);
    animation: kac-blink 2.4s steps(1) infinite;
  }
  @keyframes kac-blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.25; }
  }
  @media (prefers-reduced-motion: reduce) {
    .kac-kicker { animation: none; opacity: 1; }
  }

  .kac-name {
    position: relative;
    margin: 0 0 10px;
    font-size: clamp(28px, 6.5vw, 52px);
    font-weight: 400;
    letter-spacing: 3px;
    line-height: 1.05;
    color: var(--phosphor);
    text-shadow:
      0 0 4px var(--phosphor),
      0 0 12px var(--phosphor),
      0 0 24px var(--phosphor);
    filter: drop-shadow(0 0 2px #000);
  }

  .kac-rule {
    width: min(280px, 60%);
    height: 1px;
    margin: 10px auto 14px;
    background: linear-gradient(90deg, transparent, var(--phosphor), transparent);
    opacity: 0.6;
  }

  .kac-sub {
    margin: 0;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--phosphor-dim);
  }

  /* tiny CRT flicker on the title text */
  @keyframes kac-flicker {
    0%, 92%, 100% { text-shadow: 0 0 4px var(--phosphor), 0 0 12px var(--phosphor), 0 0 24px var(--phosphor); }
    93% { text-shadow: 0 0 2px var(--phosphor), 0 0 6px var(--phosphor); }
    95% { text-shadow: 0 0 6px var(--phosphor), 0 0 18px var(--phosphor), 0 0 36px var(--phosphor); }
    97% { text-shadow: 0 0 4px var(--phosphor), 0 0 12px var(--phosphor); }
  }
  .kac-name { animation: kac-flicker 4.5s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .kac-name { animation: none; } }

  /* golden banner owned variant */
  .kac-title.golden {
    --phosphor: #ffd700;
    --phosphor-dim: #b8860b;
    --scanline: rgba(255, 215, 0, 0.07);
  }
  .kac-title.golden .kac-name {
    text-shadow:
      0 0 4px #ffd700,
      0 0 12px #ff8c00,
      0 0 24px #ff4500;
  }
  .kac-title.golden .kac-kicker {
    color: #b8860b;
    text-shadow: 0 0 6px #ffd700;
  }

  /* <<< kac-title CSS end <<< */

  /* anti-template: flat, static */
  *, *::before, *::after {
    border-radius: 0 !important;
    box-shadow: none !important;
    animation: none !important;
  }
  .kac-name { text-shadow: none !important; filter: none !important; }
  .kac-kicker { text-shadow: none !important; }

  /* ---------- preview only (delete this block when embedding) ---------- */
  html, body { height: 100%; margin: 0; }
  body.kac-preview {
    display: grid;
    place-items: center;
    padding: 40px 20px;
    background:
      radial-gradient(ellipse at 20% 0%, #1a1a1a 0%, #000 70%),
      #000;
    font-family: "VT323", "Courier New", monospace;
  }
  body.kac-preview::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.15) 2px, rgba(0, 0, 0, 0.15) 4px);
    pointer-events: none;
    z-index: 999;
  }
</style>
</head>
<body class="kac-preview">

  <!-- ===== copy this block into your page (Option B) ===== -->
  <div class="kac-title" id="kac-title-el">
    <span class="kac-kicker">insert coin</span>
    <h1 class="kac-name">kocik's arcade</h1>
    <div class="kac-rule" aria-hidden="true"></div>
    <p class="kac-sub">13 games &middot; points &middot; point shop</p>
  </div>
  <!-- ===== end of title block ===== -->

  <script>
    // Golden banner glow when owned (localStorage key matches your site)
    (function () {
      try {
        var raw = localStorage.getItem('kociks_arcade_save');
        if (raw) {
          var s = JSON.parse(raw);
          if (s && s.items && s.items.indexOf('banner') !== -1) {
            document.getElementById('kac-title-el').classList.add('golden');
          }
        }
      } catch (e) {}
    })();
  </script>

</body>
</html>
